<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KorokNet</title>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>
    <h1>Регистрация</h1>
    {%if error%}
    <p style="color: red;">{{error}}</p>
    {%endif%}
    <p>Уже зарегистрированы? <a href="/login">Авторизация</a></p>
    <form action="/register" method="post">
        <input type="text" name="login" value="{{login}}" placeholder="Логин" required> <br>
        <input type="password" name="password" placeholder="Пароль" required> <br>
        <input type="text" name="fio" value="{{fio}}" placeholder="ФИО" required> <br>
        <input type="text" name="phone" value="{{phone}}" placeholder="Телефон" required> <br>
        <input type="text" name="email" value="{{email}}" placeholder="Почта" required> <br>
        <button type="submit">Зарегистрироваться</button>
    </form>
</body>
</html>
