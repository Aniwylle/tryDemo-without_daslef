<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KorokNet</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/glide.core.min.css">
    <link rel="stylesheet" href="/static/glide.theme.min.css">
</head>
<body>
<h1>Авторизация</h1>
{%if error%}
<p style="color: red">{{error}}</p>
{%endif%}
<p>Еще не зарегистрированы? <a href="/register">Регистрация</a></p>
<form action="/login" method="post">
    <input type="text" name="login" required placeholder="Логин"> <br>
    <input type="password" name="password" required placeholder="Пароль"> <br>
    <button type="submit">Войти</button>
</form>
<div class="glide">
    <div class="glide__track" data-glide-el="track">
        <ul class="glide__slides">
            <li class="glide__slides"><img src="/static/img/komar2.jpg" width="100%"></li>
            <li class="glide__slides"><img src="/static/img/komar3.jpg" width="100%"></li>
            <li class="glide__slides"><img src="/static/img/komar4.jpg" width="100%"></li>
        </ul>
    </div>
    <div class="glide__buttons" data-glide-el="controls">
        <button class="glide__arrow glide__arrow--left" data-glide-dir="<"><</button>
        <button class="glide__arrow glide__arrow--right" data-glide-dir=">">></button>
    </div>
</div>
<script src="/static/glide.min.js"></script>
<script>
    new Glide('.glide', {
    type: 'carousel',
    autoplay: 3000,
    perView: 1
    }).mount();
</script>
</body>
</html>
